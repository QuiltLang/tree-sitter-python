name: CI

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          # Disabled, unlike upstream: the macos-latest image pairs Swift 6.1.3
          # with the Xcode 26.6 SDK, which cannot build the Darwin overlay
          # ("could not build Objective-C module '_Builtin_float'"). It is a
          # toolchain/SDK mismatch in the runner image, not a grammar problem —
          # the corpus passes 119/119 on that same job — and quilt consumes the
          # vendored C parser, never the Swift bindings. Re-enable when the
          # image ships a matching pair.
          test-swift: false
      - name: Set up examples
        run: |-
          git clone https://github.com/numpy/numpy examples/numpy --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/django/django examples/django --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/pallets/flask examples/flask --single-branch --depth=1 --filter=blob:none
          # Pinned to a release tag, unlike upstream's floating `main`: CPython main
          # has adopted PEP 810 lazy imports (`lazy from x import y`), which this
          # grammar has no rule for, so every file using them parses to an ERROR and
          # this job is red for a reason that has nothing to do with the Quilt patches.
          # That gap is upstream's to close — tree-sitter/tree-sitter-python#335.
          # Revert to `main` once it lands. See QuiltLang/quilt#184.
          git clone https://github.com/python/cpython examples/cpython --single-branch --depth=1 --filter=blob:none --branch v3.14.0
      - name: Parse examples
        uses: tree-sitter/parse-action@v4
        with:
          files: |
            examples/**/*.py
            !examples/cpython/Lib/test/test_annotationlib.py
            !examples/cpython/Lib/test/test_compile.py
            !examples/cpython/Lib/test/test_type_params.py
          invalid-files: |
            examples/cpython/Lib/test/tokenizedata/badsyntax_3131.py
